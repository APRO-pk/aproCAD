[package]
name = "apro-cad"
version = "0.1.0"
edition = "2021"

[lib]
name = "apro_cad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rfd = "0.15"
serde = { version = "1", features = ["serde_derive"] }
serde_json = "1"
ron = "0.8"
apro-geometry = { path = "../crates/geometry" }
apro-kernel = { path = "../crates/kernel" }
apro-features = { path = "../crates/features" }
apro-document = { path = "../crates/document" }
apro-recompute = { path = "../crates/recompute" }
apro-massprops = { path = "../crates/massprops" }
apro-library = { path = "../crates/library" }
apro-grammar = { path = "../crates/grammar" }
