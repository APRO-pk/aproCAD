[package]
name = "apro-grammar"
version = "0.1.0"
edition = "2021"

[dependencies]
apro-document = { path = "../document" }
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
jsonschema = "0.49"
ron = "0.8"
