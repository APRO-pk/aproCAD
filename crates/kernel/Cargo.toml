[package]
name = "apro-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
truck-modeling = "0.6"
truck-topology = "0.6"
truck-geometry = "0.5"
truck-base = "0.5"
truck-polymesh = "0.6"
truck-meshalgo = "0.4"
truck-shapeops = { version = "0.4", default-features = false }
truck-stepio = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Phase 1 spike: enables backend/occt.rs (requires OCCT C++ libs via
# RUSTOCCT_VCPKG — see KERNEL_V2.md). Dependency line added when the
# environment is provisioned:
#   opencascade = { version = '0.7', optional = true }
occ = []
