[package]
name = "apro-library"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
ulid = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
apro-document = { path = "../document" }
apro-features = { path = "../features" }
apro-kernel = { path = "../kernel" }
apro-massprops = { path = "../massprops" }
apro-embed = { path = "../embed" }
ron = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
